<style>:root{
  --navy:#13294b; --navy-2:#1d3a66; --navy-3:#0c1c35;
  --orange:#f26a21; --orange-2:#ff8a4a;
  --teal:#159c98; --teal-2:#1fb8b3;
  --bg:#f3f5f9; --card:#ffffff; --line:#dde3ec; --text:#14213a; --muted:#5d6b82;
  --ok:#1f9d55; --warn:#d98a00; --bad:#d23c3c;
  --radius:12px; --shadow:0 2px 10px rgba(19,41,75,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;color:var(--navy)}
a{color:var(--teal)}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,var(--teal) 140%)}
.login-card{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:32px 28px;width:100%;max-width:420px}
.login-card img{width:100%;max-width:330px;display:block;margin:0 auto 18px}
.login-card h2{font-size:18px;text-align:center;margin-bottom:4px}
.login-card p.sub{text-align:center;color:var(--muted);margin:0 0 18px;font-size:13px}
.login-tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--bg);padding:4px;border-radius:10px}
.login-tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.login-tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.user-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:180px;overflow:auto}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.user-chip.on{border-color:var(--teal);background:#e9f8f7}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}

/* ---------- Shell ---------- */
header.top{background:#fff;border-bottom:4px solid var(--navy);position:sticky;top:0;z-index:50}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1400px;margin:0 auto}
.top-in img.logo{height:38px}
.top-in .spacer{flex:1}
.net{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600}
.net.on{background:#e3f6ec;color:var(--ok)} .net.off{background:#fdecec;color:var(--bad)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
nav.tabs{background:var(--navy)}
.tabs-in{display:flex;gap:4px;max-width:1400px;margin:0 auto;padding:0 20px;overflow-x:auto}
.tabs-in button{background:transparent;border:0;color:#c9d4e6;padding:13px 16px;font-weight:600;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs-in button:hover{color:#fff}
.tabs-in button.on{color:#fff;border-bottom-color:var(--orange)}
.tabs-in .dot{width:9px;height:9px;border-radius:50%}
main{max-width:1400px;margin:0 auto;padding:20px}

/* ---------- Buttons / form ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--navy-2)}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=email],input[type=tel],select,textarea{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0;font-weight:400}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(21,156,152,.35);border-color:var(--teal)}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){main .savebar{margin:0 -12px -12px}.g2,.g3,.g4{grid-template-columns:1fr}.span2,.span3{grid-column:auto}main{padding:12px}.top-in{padding:8px 12px}.top-in img.logo{height:28px}.who span.nm{display:none}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;background:#fff;font-size:14px;user-select:none}
.chk input{accent-color:var(--orange)}
.chk.on{border-color:var(--orange);background:#fff3ec}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:16px}
.card-h .num{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.card-h .spacer{flex:1}
.card-b{padding:16px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:120px}
.side a{display:block;padding:7px 10px;color:var(--muted);text-decoration:none;border-left:3px solid transparent;font-size:14px}
.side a:hover{color:var(--navy);border-left-color:var(--teal)}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}}

.page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h2{font-size:22px}
.page-h .spacer{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pill.cond{background:#e6eefb;color:var(--navy)}
.pill.corp{background:#e3f6f5;color:#0e7a77}
.pill.evt{background:#fff0e7;color:#c24e10}
.pill.draft{background:#f1f1f1;color:#666}
.pill.done{background:#e3f6ec;color:var(--ok)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafbfd}
.kpi .v{font-size:24px;font-weight:800;color:var(--navy);line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.accent{border-color:var(--orange);background:#fff6f0}.kpi.accent .v{color:var(--orange)}
.kpi.teal{border-color:var(--teal);background:#effaf9}.kpi.teal .v{color:var(--teal)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:600;font-size:13px}
table.t td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.t tr.sel td{background:#fff6f0}
table.t tr.rec td:first-child{border-left:4px solid var(--orange)}
.tbl-wrap{overflow-x:auto}
.note{background:#f4f8fc;border-left:4px solid var(--teal);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--navy-2);margin-top:10px}
.note.warn{border-left-color:var(--warn);background:#fff8e8}
.note.bad{border-left-color:var(--bad);background:#fdeeee}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- History ---------- */
.hist-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hist-tools input,.hist-tools select{max-width:260px}
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--navy)}
.hcard.corp{border-top-color:var(--teal)}.hcard.evt{border-top-color:var(--orange)}
.hcard h4{font-size:16px}
.hcard .meta{font-size:12px;color:var(--muted)}
.hcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{text-align:center;padding:50px 20px;color:var(--muted);background:#fff;border:2px dashed var(--line);border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}

/* ---------- Photos ---------- */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.ph img{width:100%;height:120px;object-fit:cover;display:block;cursor:zoom-in}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px}
.ph .x{display:flex;justify-content:space-between;align-items:center;padding:2px 6px;font-size:11px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#fafbfd}
.drop:hover,.drop.over{border-color:var(--teal);color:var(--teal)}

/* ---------- Croqui ---------- */
.cq-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
@media (max-width:1000px){.cq-wrap{grid-template-columns:1fr}}
.cq-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cq-tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:6px}
.cq-tools button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cq-tools .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.cq-canvas-box{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eef1f6;touch-action:none}
.cq-canvas-box canvas{display:block;width:100%;cursor:crosshair}
.cq-side{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfd;font-size:13px;max-height:640px;overflow:auto}
.cq-side h4{font-size:13px;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.legend-i{display:flex;align-items:center;gap:8px;margin:3px 0}
.cq-status{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px}
.el-list div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}

/* ---------- Toast / modal ---------- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:999;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin-bottom:12px}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:8px}
.savebar{position:sticky;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:40;margin:0 -20px -20px;backdrop-filter:blur(4px)}
.savebar .st{margin-right:auto;font-size:13px;color:var(--muted);align-self:center}

.dg-item{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px}
@media (max-width:700px){.dg-item{grid-template-columns:1fr}}
</style>
</head>

  </div></nav>
  <main id="main"></main>
</div>

<script>/* ================== CÁLCULOS DE DIMENSIONAMENTO ================== */
const ENV_LABEL = {
  aberto: 'Área aberta / externa',
  salao: 'Salão, galpão ou pavilhão (poucas barreiras)',
  escritorio: 'Escritório com divisórias leves',
  denso: 'Alvenaria / muitas paredes'
};

const AP_DEFAULT = {
  gwn7660: {
    id: 'gwn7660', nome: 'Grandstream GWN7660', curto: 'GWN7660',
    tipo: 'Access Point Wi-Fi 6 (802.11ax) Dual Band 2x2:2 MU-MIMO – uso interno',
    clientesMax: 256, clientesProj: 100, vazaoMbps: 1770, raioMax: 175,
    raios: { aberto: 50, salao: 30, escritorio: 20, denso: 12 },
    poeW: 13, poe: '802.3af (PoE)', porta: '1x GbE PoE', cor: '#159c98'
  },
  gwn7664elr: {
    id: 'gwn7664elr', nome: 'Grandstream GWN7664ELR', curto: 'GWN7664ELR',
    tipo: 'Access Point Wi-Fi 6 (802.11ax) 4x4:4 Extended Range (ELR) – IP68, uso interno/externo',
    clientesMax: 512, clientesProj: 250, vazaoMbps: 3550, raioMax: 300,
    raios: { aberto: 120, salao: 55, escritorio: 28, denso: 16 },
    poeW: 25.5, poe: '802.3at (PoE+)', porta: '2,5 GbE PoE/PoE+ e SFP 2,5G', cor: '#f26a21'
  }
};
const RAIO_LIMITE = 300;      // raio máximo registrável (m)
const UTP_MAX = 90;           // enlace permanente UTP (TIA-568)
const VAZAO_UTIL = 0.35;      // fração da vazão nominal considerada útil em projeto
const CABO_RESERVA = 0.30;    // reserva de cabo (+30%) – padrão dos memoriais

function nOr(v, d = 0) { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : d; }
function iOr(v, d = 0) { return Math.max(0, Math.round(nOr(v, d))); }
function nextOf(list, v) { for (const x of list) if (x >= v) return x; return list[list.length - 1]; }

/* ---------- CONDOMÍNIO: quantitativo + CTOs ---------- */
const CTO_TIPOS = [4, 8, 16];                 // CTO de condomínio 1:4, 1:8, 1:16
const SPLITTERS = [2, 4, 6, 8, 16, 32];       // splitter primário (CEO)
const SPLIT_LOSS = { 2: 3.7, 4: 7.3, 6: 9.0, 8: 10.5, 16: 13.7, 32: 17.1 }; // perda típica (dB)
function calcCond(c) {
  c = c || {};
  const vertical = (c.kind || 'vertical') === 'vertical';
  const reserva = Math.min(50, Math.max(0, nOr(c.reserva, 10)));
  const dropMed = nOr(c.dropMedio, vertical ? 25 : 60);
  const S = SPLITTERS.includes(iOr(c.splitter)) ? iOr(c.splitter) : 8;
  const tipos = CTO_TIPOS.includes(iOr(c.ctoTipo)) ? [iOr(c.ctoTipo)] : CTO_TIPOS;
  const out = { vertical, reserva, opts: [], ok: false, S, tipos };
  if (vertical) {
    const T = iOr(c.torres), F = iOr(c.andares), A = iOr(c.aptos);
    const extra = iOr(c.unidadesExtras); // salas, lojas, áreas comuns por torre
    const s0 = iOr(c.andarInicial); const s = s0 >= 1 && s0 <= F ? s0 : 0;
    out.T = T; out.F = F; out.A = A; out.extra = extra; out.andarInicial = s;
    out.porTorre = F * A + extra;
    out.total = T * out.porTorre;
    if (!(T && F && A)) return out;
    out.ok = true;
    for (const P of tipos) {
      const eff = Math.max(1, P - Math.ceil(P * reserva / 100));
      // Opção 1: CTO(s) em todos os andares
      out.opts.push(mkOptV({ P, eff, k: 1, porAndarCTO: Math.ceil(A / eff), F, A, T, extra, tipo: 'andar' }));
      // Opção 2: CTOs intercaladas (1 CTO atende k andares)
      for (let k = 2; k <= Math.min(4, F); k++) {
        const o = mkOptV({ P, eff, k, porAndarCTO: 1, F, A, T, extra, tipo: 'grupo', s });
        if (o) out.opts.push(o);
      }
    }
  } else {
    const H = iOr(c.casas), extra = iOr(c.unidadesExtras);
    out.H = H; out.extra = extra; out.total = H + extra;
    if (!H) return out;
    out.ok = true;
    for (const P of tipos) {
      const eff = Math.max(1, P - Math.ceil(P * reserva / 100));
      const n = Math.ceil(out.total / eff);
      out.opts.push({
        id: 'h' + P, P, eff, tipo: 'horiz', totalCTO: n,
        titulo: `CTO de condomínio 1:${P} distribuídas nas vias internas`,
        desc: `Cada CTO atende até ${eff} casas (${P} portas com ${P - eff} de reserva). Posicionar em postes/caixas subterrâneas de modo que o drop até cada casa não ultrapasse ~150 m.`,
        portas: n * P, ocup: out.total / (n * P), locais: `${n} pontos ao longo das vias`
      });
    }
  }
  out.opts.forEach(o => {
    o.S = S; o.splitSec = o.totalCTO; o.splitPri = Math.ceil(o.totalCTO / S); o.fusoes = 2 * o.totalCTO + 2;
    o.razao = S * o.P; o.perda = +(SPLIT_LOSS[S] + SPLIT_LOSS[o.P]).toFixed(1);
  });
  // recomendação: menor nº de CTOs com intercalação <= 3 andares (drop curto), desempate pela maior reserva
  const cand = out.opts.filter(o => !o.k || o.k <= 3);
  cand.sort((a, b) => a.totalCTO - b.totalCTO || (b.portas - a.portas));
  out.rec = cand[0] ? cand[0].id : (out.opts[0] && out.opts[0].id);
  out.dropTotal = Math.ceil(out.total * dropMed);
  out.dropMed = dropMed;
  return out;
}
function condSel(v, c) { return c.opts.find(o => o.id === v.cond.ctoEscolha) || c.opts.find(o => o.id === c.rec) || c.opts[0]; }
function mkOptV({ P, eff, k, porAndarCTO, F, A, T, extra, tipo, s }) {
  let andares = [], porTorre;
  if (tipo === 'andar') { porTorre = F * porAndarCTO; andares = Array.from({ length: F }, (_, i) => i + 1); }
  else {
    if (s) { for (let f = s; f <= F; f += k) andares.push(f); }
    else { const n = Math.ceil(F / k); for (let g = 0; g < n; g++) { const ini = g * k + 1, fim = Math.min(F, ini + k - 1); andares.push(ini + Math.floor((fim - ini) / 2)); } }
    // cada andar é atendido pela CTO mais próxima; verifica capacidade e distância
    const carga = andares.map(() => 0); let dist = 0;
    for (let f = 1; f <= F; f++) {
      const ord = andares.map((a, i) => i).sort((x, y) => Math.abs(andares[x] - f) - Math.abs(andares[y] - f) || carga[x] - carga[y]);
      const bi = ord.find(i => carga[i] + A <= eff) ?? ord[0];
      carga[bi] += A; dist = Math.max(dist, Math.abs(andares[bi] - f));
    }
    if (Math.max(...carga) > eff || dist > 2 || andares.length >= F) return null;
    porTorre = andares.length;
  }
  if (extra) porTorre += Math.ceil(extra / eff);
  const totalCTO = porTorre * T;
  const portas = totalCTO * P;
  const unidades = T * (F * A + extra);
  return {
    id: `${tipo}${P}k${k}s${s || 0}`, P, eff, k, tipo, porTorre, totalCTO, portas, andares, porAndarCTO,
    ocup: unidades / portas,
    fibrasTorre: nextOf([6, 12, 24, 36, 48, 72, 144], porTorre),
    titulo: tipo === 'andar'
      ? `CTO de condomínio 1:${P} em todos os andares${porAndarCTO > 1 ? ` (${porAndarCTO} por andar)` : ''}`
      : `CTO de condomínio 1:${P} intercalada a cada ${k} andares${s ? ` a partir do ${s}º` : ''}`,
    desc: tipo === 'andar'
      ? `${porAndarCTO} CTO 1:${P} por andar atendendo ${A} apartamentos (capacidade útil ${eff * porAndarCTO}).`
      : `1 CTO 1:${P} a cada ${k} andares; cada CTO atende os andares mais próximos (até ${Math.min(F, k) * A} aptos, capacidade útil ${eff}).`,
    locais: tipo === 'andar' ? 'Todos os andares (shaft de telecom)' : 'Andares: ' + andares.map(a => a + 'º').join(', ') + ' (shaft de telecom)'
  };
}

/* ---------- ACCESS POINTS ---------- */
function apModels(cfg) {
  const out = {};
  for (const id in AP_DEFAULT) out[id] = Object.assign({}, AP_DEFAULT[id], (cfg && cfg.ap && cfg.ap[id]) || {},
    { raios: Object.assign({}, AP_DEFAULT[id].raios, (cfg && cfg.ap && cfg.ap[id] && cfg.ap[id].raios) || {}) });
  return out;
}
function areaOf(a) {
  a = a || {};
  const W = nOr(a.largura), L = nOr(a.comprimento);
  const area = nOr(a.area) || (W && L ? W * L : 0);
  return { W, L, area };
}
function raioProj(model, env, override) {
  const r = nOr(override) || model.raios[env || 'salao'] || 20;
  return Math.min(RAIO_LIMITE, Math.max(1, r));
}
/* devices: dispositivos simultâneos ; mbps: demanda média por dispositivo */
function calcAPModel(model, a, devices, mbps, override) {
  const { W, L, area } = areaOf(a);
  const env = a.ambiente || 'salao';
  const r = raioProj(model, env, override);
  const side = r * Math.SQRT2; // quadrado inscrito no círculo de cobertura
  let cols = 0, rows = 0, cov = 0;
  if (W && L) { cols = Math.max(1, Math.ceil(W / side)); rows = Math.max(1, Math.ceil(L / side)); cov = cols * rows; }
  else if (area) { cov = Math.max(1, Math.ceil(area / (2 * r * r))); }
  const cap = devices ? Math.ceil(devices / model.clientesProj) : 0;
  const thr = devices && mbps ? Math.ceil(devices * mbps / (model.vazaoMbps * VAZAO_UTIL)) : 0;
  const N = Math.max(cov, cap, thr, (area || devices) ? 1 : 0);
  const fator = N === 0 ? '-' : (N === cov ? 'cobertura' : N === cap ? 'nº de dispositivos' : 'vazão');
  const pos = (W && L && N) ? gridPositions(W, L, N, cols, rows) : [];
  return { model, r, cov, cap, thr, N, fator, pos, area, W, L, devPorAP: N ? Math.ceil(devices / N) : 0, poeTotal: N * model.poeW };
}
function gridPositions(W, L, N, cols, rows) {
  rows = Math.max(1, rows || 1); cols = Math.max(1, cols || 1);
  while (rows * cols < N) { if (W / cols >= L / rows) cols++; else rows++; }
  while (rows > 1 && (rows - 1) * cols >= N) rows--;
  const pos = [];
  const base = Math.floor(N / rows), rest = N % rows;
  for (let r = 0; r < rows; r++) {
    const n = base + (r < rest ? 1 : 0);
    const y = L * (r + 0.5) / rows;
    for (let c = 0; c < n; c++) pos.push({ x: W * (c + 0.5) / n, y });
  }
  return pos;
}
function calcAP(cfg, a, devices, mbps, raioOverride) {
  const models = apModels(cfg);
  const res = {};
  for (const id in models) res[id] = calcAPModel(models[id], a || {}, devices, mbps, raioOverride && raioOverride[id]);
  const ids = Object.keys(res).filter(id => res[id].N > 0);
  let rec = null;
  if (ids.length) {
    const env = (a && a.ambiente) || 'salao';
    ids.sort((x, y) => res[x].N - res[y].N || ((env === 'aberto' ? (x === 'gwn7664elr' ? -1 : 1) : (x === 'gwn7660' ? -1 : 1))));
    rec = ids[0];
  }
  return { res, rec, models };
}

/* mediana geométrica (Weiszfeld) – minimiza o total de cabo até os APs */
function geoMedian(pts) {
  if (!pts.length) return null;
  let x = pts.reduce((s, p) => s + p.x, 0) / pts.length, y = pts.reduce((s, p) => s + p.y, 0) / pts.length;
  for (let it = 0; it < 80; it++) {
    let nx = 0, ny = 0, d = 0;
    for (const p of pts) { const w = 1 / Math.max(1e-6, Math.hypot(p.x - x, p.y - y)); nx += p.x * w; ny += p.y * w; d += w; }
    x = nx / d; y = ny / d;
  }
  return { x, y };
}
/* comprimento estimado de cabo: rota ortogonal + subida/descida + sobra */
function caboEstimado(dx, dy, peDireito) { return Math.abs(dx) + Math.abs(dy) + 2 * nOr(peDireito, 3) + 5; }

function calcRack(nAP, model, pontosCabeados, extraPoE) {
  const portas = nAP + iOr(pontosCabeados) + 2;
  const sw = nextOf([8, 16, 24, 48], portas);
  const nSw = portas > 48 ? Math.ceil(portas / 46) : 1;
  const poe = nAP * (model ? model.poeW : 0) + nOr(extraPoE);
  const patch = Math.ceil((nAP + iOr(pontosCabeados)) / 24) || 1;
  const itens = [
    ['Roteador / ONU / conversor de mídia', 1],
    [`Switch PoE ${sw > 48 ? 48 : sw} portas`, nSw],
    ['Patch panel 24 portas', patch],
    ['Organizador de cabos 1U', patch],
    ['DIO / bandeja de emenda óptica', 1],
    ['Régua de tomadas (PDU) 1U', 1]
  ];
  const U = itens.reduce((s, i) => s + i[1], 0);
  const rack = nextOf([5, 8, 12, 16, 20, 24, 44], Math.ceil(U * 1.3));
  return { portas, sw, nSw, poe, U, rack, itens, patch };
}

/* ---------- EVENTOS: demanda ---------- */
function calcEvento(e) {
  e = e || {};
  const pub = iOr(e.publico), simult = nOr(e.simultaneidade, 40) / 100, dpp = nOr(e.dispPorPessoa, 1);
  const s = e.serv || {};
  const linhas = [
    ['Público (simultâneo conectado)', Math.ceil(pub * simult * dpp), `${pub} pessoas × ${Math.round(simult * 100)}% × ${dpp} disp.`],
    ['Credenciamento', iOr(s.cred), 'dispositivos'],
    ['Área administrativa', Math.ceil(iOr(s.admin) * 2), `${iOr(s.admin)} pessoas × 2 disp.`],
    ['Expositores – computadores', iOr(s.exposPC), 'computadores'],
    ['Expositores – projetos', iOr(s.exposProj) * 2, `${iOr(s.exposProj)} projetos × 2 disp.`]
  ];
  (e.extras || []).forEach(x => { if (x && x.nome) linhas.push([x.nome, iOr(x.qtd), x.obs || 'dispositivos']); });
  const wifi = linhas.reduce((t, l) => t + l[1], 0);
  const stream = iOr(s.streamPontos), up = nOr(s.streamUp);
  const cabeados = stream + iOr(s.credCabeado) + iOr(s.outrosCabeados);
  const mbps = nOr(e.mbpsDisp, 2);
  const down = wifi * mbps * 0.5 + stream * up; // fator de uso simultâneo de banda 50%
  const upTot = stream * up + wifi * mbps * 0.1;
  const link = nextOf([100, 200, 300, 500, 600, 1000, 2000, 5000, 10000], Math.max(down, upTot));
  return { linhas, wifi, stream, up, cabeados, down: Math.ceil(down), upTot: Math.ceil(upTot), link, mbps };
}

function initials(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function hashPin(s) { // hash local simples (não é segurança forte – apenas separação de perfis no dispositivo)
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; s = 'clickip:' + s;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }

  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

/* imagem -> dataURL JPEG redimensionada */
function readImage(file, max = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); res({ data: c.toDataURL('image/jpeg', q), w: c.width, h: c.height }); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ================== BANCO DE DADOS (IndexedDB, fallback localStorage) ================== */
const DB = {
  db: null, mem: false,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('clickip_visitas', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('users', { keyPath: 'id' });
          const v = d.createObjectStore('visits', { keyPath: 'id' }); v.createIndex('userId', 'userId');
          d.createObjectStore('settings', { keyPath: 'userId' });
        };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => { this.mem = true; res(); };
      } catch (e) { this.mem = true; res(); }
    });
  },
  _ls(store) { try { return JSON.parse(localStorage.getItem('cip_' + store) || '{}'); } catch (e) { return {}; } },
  _lsw(store, o) { localStorage.setItem('cip_' + store, JSON.stringify(o)); },
  _kp(store) { return store === 'settings' ? 'userId' : 'id'; },
  put(store, val) {
    if (this.mem) { const o = this._ls(store); o[val[this._kp(store)]] = val; this._lsw(store, o); return Promise.resolve(); }
    return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).put(val); t.oncomplete = res; t.onerror = () => rej(t.error); });
  },
  get(store, key) {
    if (this.mem) return Promise.resolve(this._ls(store)[key]);
    return new Promise(res => { const r = this.db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
  },
  del(store, key) {
    if (this.mem) { const o = this._ls(store); delete o[key]; this._lsw(store, o); return Promise.resolve(); }
    return new Promise(res => { const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).delete(key); t.oncomplete = res; });
  },
  all(store) {
    if (this.mem) return Promise.resolve(Object.values(this._ls(store)));
    return new Promise(res => { const r = this.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); });
  },
  byUser(userId) {
    if (this.mem) return Promise.resolve(Object.values(this._ls('visits')).filter(v => v.userId === userId));
    return new Promise(res => { const r = this.db.transaction('visits').objectStore('visits').index('userId').getAll(userId); r.onsuccess = () => res(r.result || []); });
  }
};

function summaryLine(v) {
  try {

  } catch (e) { return ''; }
}

/* ================== HELPERS DE FORMULÁRIO ================== */
function fld(label, path, o = {}) {
  const v = getP(S.cur, path) ?? '';
  const t = o.type || 'text', cls = o.cls ? ` class="f ${o.cls}"` : ' class="f"';
  const hint = o.hint ? `<span class="hint">${o.hint}</span>` : '';
  let inp;
  if (t === 'textarea') inp = `<textarea data-k="${path}" placeholder="${esc(o.ph || '')}" ${o.rows ? `style="min-height:${o.rows * 22}px"` : ''}>${esc(v)}</textarea>`;
  else if (t === 'select') inp = `<select data-k="${path}" ${o.re ? 'data-re="1"' : ''}>${(o.opts || []).map(([a, b]) => `<option value="${esc(a)}" ${String(v) === String(a) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>`;
  else inp = `<input type="${t}" data-k="${path}" ${t === 'number' ? 'data-n="1" inputmode="decimal" step="any" min="0"' : ''} ${o.max ? `max="${o.max}"` : ''} value="${esc(v)}" placeholder="${esc(o.ph || '')}">`;
  return `<label${cls}>${label}${o.unit ? ` <span class="hint">(${o.unit})</span>` : ''}${inp}${hint}</label>`;
}
function seg(path, opts, re = true) {
  const v = getP(S.cur, path);
  return `<div class="seg">${opts.map(([a, b]) => `<button type="button" data-seg="${path}" data-v="${esc(a)}" ${re ? 'data-re="1"' : ''} class="${String(v) === String(a) ? 'on' : ''}">${b}</button>`).join('')}</div>`;
}
function chks(path, opts) {
  const v = getP(S.cur, path) || [];
  return `<div class="checks">${opts.map(([a, b]) => `<label class="chk ${v.includes(a) ? 'on' : ''}"><input type="checkbox" data-chk="${path}" value="${esc(a)}" ${v.includes(a) ? 'checked' : ''}>${b}</label>`).join('')}</div>`;
}
function card(id, n, title, body, extra = '') {
  return `<section class="card" id="sec-${id}"><div class="card-h"><div class="num">${n}</div><h3>${title}</h3><div class="spacer"></div>${extra}</div><div class="card-b">${body}</div></section>`;
}

/* ================== FORMULÁRIO ================== */
function renderForm(v) {
  S.cur = v; const t = v.type;
  let secs = [];
  if (t === 'cond') secs = [['cli', 'Cliente'], ['loc', 'Localização'], ['est', 'Estrutura'], ['qtd', 'Quantitativo geral'], ['cto', 'Dimensionamento de CTOs'], ['infra', 'Infraestrutura'], ['diag', 'CEOs e POP'], ['croqui', 'Planta / croqui'], ['fotos', 'Fotos'], ['obs', 'Observações']];
  if (t === 'corp') secs = [['cli', 'Cliente'], ['loc', 'Localização'], ['srv', 'Serviço e velocidade'], ['area', 'Área e ambiente'], ['ap', 'Access points'], ['rack', 'Rack'], ['infra', 'Infraestrutura'], ['diag', 'CEOs e POP'], ['croqui', 'Planta / croqui'], ['fotos', 'Fotos'], ['obs', 'Observações']];
  if (t === 'evt') secs = [['cli', 'Cliente'], ['loc', 'Localização'], ['ev', 'Dados do evento'], ['atd', 'Atendimentos'], ['area', 'Área e ambiente'], ['ap', 'Access points e link'], ['rack', 'Rack'], ['infra', 'Infraestrutura'], ['croqui', 'Planta / croqui'], ['fotos', 'Fotos'], ['obs', 'Observação geral']];
  let n = 0, body = '';
  for (const [id] of secs) {
    n++;
    if (id === 'cli') body += secCliente(n);
    else if (id === 'loc') body += secLocal(n);
    else if (id === 'infra') body += secInfra(n);
    else if (id === 'diag') body += secDiag(n);
    else if (id === 'croqui') body += secCroqui(n);
    else if (id === 'fotos') body += secFotos(n);
    else if (id === 'obs') body += secObs(n, t === 'evt' ? 'Observação geral da visita' : null);

/* ================== BIND ================== */
function bindForm() {
  const root = $('#main');
  root.oninput = onFormInput; root.onchange = onFormChange; root.onclick = onFormClick;
  $('#btnBack').onclick = () => go(S.cur.type);
  $('#btnSave').onclick = () => { S.dirty = true; saveNow(); toast('Visita salva'); };
  $('#btnPdf').onclick = () => { saveNow(); openReport(S.cur); };
  $('#btnDel').onclick = () => deleteVisit(S.cur.id);
  $('#stDone').onchange = e => { S.cur.status = e.target.checked ? 'done' : 'draft'; e.target.parentElement.classList.toggle('on', e.target.checked); scheduleSave(); };
  $('#btnGPS').onclick = () => {
    if (!navigator.geolocation) return toast('GPS indisponível neste navegador');
    toast('Obtendo localização…');
    navigator.geolocation.getCurrentPosition(p => { S.cur.loc.lat = +p.coords.latitude.toFixed(7); S.cur.loc.lon = +p.coords.longitude.toFixed(7); scheduleSave(); refreshLoc(); toast('Localização capturada (±' + Math.round(p.coords.accuracy) + ' m)'); },
      e => toast('Não foi possível obter o GPS: ' + e.message, 4000), { enableHighAccuracy: true, timeout: 15000 });
  };
  $('#pasteLL').onchange = e => { const m = e.target.value.match(/(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)/); if (!m) return toast('Formato esperado: lat, lon'); S.cur.loc.lat = nOr(m[1]); S.cur.loc.lon = nOr(m[2]); e.target.value = ''; scheduleSave(); refreshLoc(); };
  $('#kmlIn').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const m = (await f.text()).match(/<coordinates>\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/);
    if (!m) return toast('Nenhum ponto encontrado no KML');
    S.cur.loc.lon = +m[1]; S.cur.loc.lat = +m[2]; scheduleSave(); refreshLoc(); toast('Coordenadas importadas');
  };
  const exAdd = $('#exAdd'); if (exAdd) exAdd.onclick = () => { S.cur.evt.extras = S.cur.evt.extras || []; S.cur.evt.extras.push({}); scheduleSave(); rerender(); };
  $$('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); const el = $('#sec-' + a.dataset.jump); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 120, behavior: 'smooth' }); });
  bindPhotos();
  bindDiag();
}
function refreshLoc() {
  $$('[data-k="loc.lat"]').forEach(i => i.value = S.cur.loc.lat ?? ''); $$('[data-k="loc.lon"]').forEach(i => i.value = S.cur.loc.lon ?? '');
  const l = S.cur.loc, has = l.lat && l.lon;
  $('#lnkMaps').classList.toggle('hidden', !has); $('#lnkEarth').classList.toggle('hidden', !has);
  $('#lnkMaps').href = `https://www.google.com/maps?q=${l.lat},${l.lon}`; $('#lnkEarth').href = `https://earth.google.com/web/search/${l.lat},${l.lon}`;
}
function rerender() { const y = window.scrollY; renderForm(S.cur); window.scrollTo(0, y); }
function onFormInput(e) {
  const el = e.target, k = el.dataset && el.dataset.k; if (!k) return;
  let val = el.value; if (el.dataset.n) val = val === '' ? '' : nOr(val);
  setP(S.cur, k, val); scheduleSave();
  if (k === 'cli.nome') $('#formTitle').textContent = visitTitle(S.cur);
  if (k.startsWith('loc.')) refreshLoc();
  updateCalc();
}
function onFormChange(e) {
  const el = e.target;
  if (el.dataset.chk) {
    const arr = getP(S.cur, el.dataset.chk) || []; const v = el.value;
    const nv = el.checked ? [...new Set([...arr, v])] : arr.filter(x => x !== v);
    setP(S.cur, el.dataset.chk, nv); el.parentElement.classList.toggle('on', el.checked); scheduleSave();
    if (v === 'outro') rerender(); else updateCalc();
  }
  if (el.dataset.re && el.dataset.k) rerender();
  if (el.name === 'ctoOpt') { S.cur.cond.ctoEscolha = el.value; scheduleSave(); updateCalc(); if (window.CQ) CQ.draw(); }
  if (el.name === 'apOpt') { S.cur.ap.escolha = el.value; scheduleSave(); updateCalc(); if (window.CQ) CQ.draw(); }
}
function onFormClick(e) {
  const b = e.target.closest('[data-seg]');
  if (b) {
    const cur = getP(S.cur, b.dataset.seg); const v = b.dataset.v;
    setP(S.cur, b.dataset.seg, cur === v ? '' : v); scheduleSave();
    if (b.dataset.re) rerender(); else { $$(`[data-seg="${b.dataset.seg}"]`).forEach(x => x.classList.toggle('on', x.dataset.v === getP(S.cur, b.dataset.seg))); updateCalc(); }
    return;
  }
  const a = e.target.closest('[data-act]');
  if (a) { saveNow(); if (a.dataset.act === 'kml') exportKML(S.cur); else if (a.dataset.act === 'kmz') exportKMZ(S.cur); return; }
  const xd = e.target.closest('[data-exdel]');
  if (xd) { S.cur.evt.extras.splice(+xd.dataset.exdel, 1); scheduleSave(); rerender(); }
}

/* ================== RESULTADOS (cálculos ao vivo) ================== */
function apInputs(v) {
  if (v.type === 'corp') return { area: v.corp.area || {}, dev: iOr(v.corp.usuarios), mbps: nOr(v.corp.mbpsDisp, 3), cab: iOr(v.corp.pontosCabeados) };
  const e = calcEvento(v.evt); return { area: v.evt.area || {}, dev: e.wifi, mbps: nOr(v.evt.mbpsDisp, 2), cab: e.cabeados, ev: e };
}
function apSummary(v, cfg) {
  if (v.type === 'cond') return null;
  const I = apInputs(v);
  const ap = calcAP(cfg || S.cfg, I.area, I.dev, I.mbps, v.ap && v.ap.raio);
  const id = (v.ap && v.ap.escolha && ap.res[v.ap.escolha] && ap.res[v.ap.escolha].N) ? v.ap.escolha : ap.rec;
  if (!id) return null;
  return Object.assign({}, ap.res[id], { id, all: ap, I });
}
function updateCalc() {
  const v = S.cur; if (!v) return;
  if (v.type === 'cond') { renderQtd(); renderCTO(); }

function riserSVG(v, c, o) {
  if (!o) return '';
  const nT = Math.min(c.T, 6), F = c.F, fh = Math.max(14, Math.min(26, 360 / F)), tw = 120, gap = 40, H = F * fh + 70, W = nT * (tw + gap) + 40 + (c.T > 6 ? 90 : 0);
  const nome = v.cond.nomenclatura || 'Torre';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="font-family:Segoe UI,Arial;font-size:11px">`;
  for (let t = 0; t < nT; t++) {
    const x = 30 + t * (tw + gap), y0 = 20;
    s += `<text x="${x + tw / 2}" y="14" text-anchor="middle" font-weight="700" fill="#13294b">${nome} ${t + 1}</text>`;
    for (let f = F; f >= 1; f--) {
      const y = y0 + (F - f) * fh, has = o.andares.includes(f);
      s += `<rect x="${x}" y="${y}" width="${tw}" height="${fh}" fill="${has ? '#fff3ec' : '#f4f6fa'}" stroke="#c5cfdd"/>`;
      s += `<text x="${x + 4}" y="${y + fh / 2 + 4}" fill="#5d6b82">${f}º</text>`;
      if (has) { for (let k = 0; k < (o.porAndarCTO || 1); k++) s += `<rect x="${x + tw - 44 - k * 6}" y="${y + 3}" width="38" height="${fh - 6}" rx="3" fill="#f26a21"/><text x="${x + tw - 25 - k * 6}" y="${y + fh / 2 + 4}" text-anchor="middle" fill="#fff" font-weight="700">CTO</text>`; }
    }
    const yb = y0 + F * fh;
    s += `<rect x="${x}" y="${yb}" width="${tw}" height="16" fill="#13294b"/><text x="${x + tw / 2}" y="${yb + 12}" text-anchor="middle" fill="#fff">Térreo / shaft</text>`;
    s += `<line x1="${x + tw - 8}" y1="${y0}" x2="${x + tw - 8}" y2="${yb}" stroke="#159c98" stroke-width="2" stroke-dasharray="4 3"/>`;
    s += `<line x1="${x + tw / 2}" y1="${yb + 16}" x2="${x + tw / 2}" y2="${yb + 34}" stroke="#159c98" stroke-width="2"/>`;
  }
  const yl = 20 + F * fh + 34;
  s += `<line x1="${30 + tw / 2}" y1="${yl}" x2="${30 + (nT - 1) * (tw + gap) + tw / 2}" y2="${yl}" stroke="#159c98" stroke-width="2"/>`;
  if (c.T > 6) s += `<text x="${30 + nT * (tw + gap)}" y="${H / 2}" fill="#13294b">+ ${c.T - 6} ${nome.toLowerCase()}s</text>`;
  s += `<text x="30" y="${H - 6}" fill="#13294b" font-weight="700">CEO / splitter primário · cabo ${o.fibrasTorre}FO por ${nome.toLowerCase()} · ${o.porTorre} CTO(s) por ${nome.toLowerCase()}</text></svg>`;
  return s;
}

const CLOUD = {
  sb: null, uid: null, busy: false, t: null, lastSync: 0, started: false,
  init() {
    if (!window.supabase || /SEU-PROJETO/.test(SUPABASE_URL)) return;
    this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    this.sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { loginMode = 'recover'; this.started = false; renderLogin(); } });
  },
  offlineSession() { // sessão guardada pelo Supabase neste aparelho (permite abrir sem internet)
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^sb-.*-auth-token$/.test(k)) { const s = JSON.parse(localStorage.getItem(k)); const u = s && (s.user || (s.currentSession && s.currentSession.user)); if (u && u.id) return { user: u }; } } } catch (e) { }
    return null;
  },
  qKey() { return 'cip_q_' + this.uid; },
  queue() { try { return Object.assign({ v: {}, d: {}, s: 0, p: 0 }, JSON.parse(localStorage.getItem(this.qKey()) || '{}')); } catch (e) { return { v: {}, d: {}, s: 0, p: 0 }; } },
  setQ(q) { localStorage.setItem(this.qKey(), JSON.stringify(q)); },
  pending() { const q = this.queue(); return Object.keys(q.v).length + Object.keys(q.d).length + (q.s ? 1 : 0) + (q.p ? 1 : 0); },
  mark(kind, id) {
    if (!this.uid) return; const q = this.queue(), tk = Date.now() + Math.random();
    if (kind === 'v') { q.v[id] = tk; delete q.d[id]; } else if (kind === 'd') { q.d[id] = tk; delete q.v[id]; } else q[kind] = tk;
    this.setQ(q); this.status(); this.schedule();
  },
  onLocal(store, val) { if (store === 'visits' && val && val.userId === this.uid) this.mark('v', val.id); else if (store === 'settings' && val && val.userId === this.uid) this.mark('s'); else if (store === 'users' && val && val.id === this.uid) this.mark('p'); },
  onLocalDel(store, key) { if (store === 'visits') this.mark('d', key); },
  schedule(ms = 2500) { clearTimeout(this.t); this.t = setTimeout(() => this.flush(), ms); },
  status(txt) {
    const el = $('#sync'); if (!el) return;
    if (!txt) { const n = this.pending(); txt = !this.sb ? '⚠ Sem nuvem' : n ? `⟳ ${n} pendente(s)` : (this.lastSync ? '☁ Sincronizado' : '☁'); }
    el.textContent = txt; const si = $('#syncInfo'); if (si) si.textContent = txt + (this.lastSync ? ' · última sincronização ' + new Date(this.lastSync).toLocaleTimeString('pt-BR') : '');
  },
  ownPath(v, p) { return p && p.startsWith(`${this.uid}/${v.id}/`); },

  async pushVisit(v) {
    const sb = this.sb, base = `${this.uid}/${v.id}/`;
    for (const r of imgRefs(v)) {
      const d = r.o[r.k], pk = r.k + 'Path';
      if (this.ownPath(v, r.o[pk]) || typeof d !== 'string' || !d.startsWith('data:')) continue;
      const path = base + uid() + '.jpg', blob = dataURLtoBlob(d);
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type, upsert: true });
      if (error) throw error;
      r.o[pk] = path;
    }
    const copy = JSON.parse(JSON.stringify(v)); delete copy._sync;
    imgRefs(copy).forEach(r => { if (r.o[r.k + 'Path']) r.o[r.k] = null; });
    const { error } = await sb.from('visits').upsert({ id: v.id, user_id: this.uid, type: v.type, status: v.status, cliente: visitTitle(v), data: copy, updated_at: v.updatedAt });
    if (error) throw error;
    v._sync = v.updatedAt; await DB.put('visits', JSON.parse(JSON.stringify(v)), true);
    const keep = new Set(imgRefs(v).map(r => r.o[r.k + 'Path']).filter(Boolean));
    const { data: files } = await sb.storage.from(BUCKET).list(this.uid + '/' + v.id, { limit: 1000 });
    const rm = (files || []).map(f => base + f.name).filter(p => !keep.has(p));
    if (rm.length) await sb.storage.from(BUCKET).remove(rm);
  },
  async rmFolder(id) {
    const dir = this.uid + '/' + id; const { data: files } = await this.sb.storage.from(BUCKET).list(dir, { limit: 1000 });
    if (files && files.length) await this.sb.storage.from(BUCKET).remove(files.map(f => dir + '/' + f.name));
  },

  async flush() {
    if (!this.sb || !this.uid || !S.user || this.busy) return;
    if (!navigator.onLine) return this.status();
    this.busy = true; this.status('⟳ Sincronizando…'); let err = null;
    try {
      const sb = this.sb; let q = this.queue();
      if (q.p) { const tk = q.p, u = S.user; const { error } = await sb.from('profiles').upsert({ id: this.uid, name: u.name, role: u.role || '', email: u.email || '', updated_at: new Date().toISOString() }); if (error) throw error; q = this.queue(); if (q.p === tk) { q.p = 0; this.setQ(q); } }
      q = this.queue();
      if (q.s && S.cfg) { const tk = q.s; const { error } = await sb.from('settings').upsert({ user_id: this.uid, data: S.cfg, updated_at: new Date().toISOString() }); if (error) throw error; q = this.queue(); if (q.s === tk) { q.s = 0; this.setQ(q); } }
      for (const [id, tk] of Object.entries(this.queue().d)) {
        const { error } = await sb.from('visits').delete().eq('id', id); if (error) throw error;
        await this.rmFolder(id); q = this.queue(); if (q.d[id] === tk) { delete q.d[id]; this.setQ(q); }
      }
      for (const [id, tk] of Object.entries(this.queue().v)) {
        const v = S.visits.find(x => x.id === id); if (v) await this.pushVisit(v);
        q = this.queue(); if (q.v[id] === tk) { delete q.v[id]; this.setQ(q); }
      }
      this.lastSync = Date.now();
    } catch (e) { err = e; console.error('Sincronização:', e); }
    this.busy = false;
    if (err) {
      if (/JWT|token|401|not authenticated/i.test(String(err.message || err))) { toast('Sua sessão expirou. Entre novamente para sincronizar.', 5000); }
      this.status('⚠ Erro ao sincronizar'); this.schedule(30000);
    } else { this.status(); if (this.pending()) this.schedule(1000); }
  },

  async pull() {
    const sb = this.sb, uidv = this.uid; let q = this.queue();
    const { data: pr, error: e1 } = await sb.from('profiles').select('*').eq('id', uidv).maybeSingle(); if (e1) throw e1;
    if (pr && !q.p) { S.user.name = pr.name || S.user.name; S.user.role = pr.role || ''; await DB.put('users', S.user, true); $('#whoName').textContent = S.user.name; $('#whoAv').textContent = initials(S.user.name); }
    else if (!pr) this.mark('p');
    const { data: st, error: e2 } = await sb.from('settings').select('data').eq('user_id', uidv).maybeSingle(); if (e2) throw e2;
    q = this.queue();
    if (st && st.data && !q.s) { S.cfg = Object.assign({}, st.data, { userId: uidv }); await DB.put('settings', S.cfg, true); }
    else if (!st) this.mark('s');
    const { data: rows, error } = await sb.from('visits').select('id,data,updated_at'); if (error) throw error;
    q = this.queue(); const remote = new Set();
    for (const r of rows || []) {
      remote.add(r.id); if (q.v[r.id] || q.d[r.id] || !r.data) continue;
      const rv = r.data; rv.updatedAt = rv.updatedAt || r.updated_at; rv.userId = uidv;
      const local = S.visits.find(v => v.id === r.id);
      if (local) {
        if (S.cur && S.cur.id === local.id) continue;
        if ((local.updatedAt || '') >= rv.updatedAt) { if (!local._sync) this.mark('v', local.id); continue; }
        const m = new Map(imgRefs(local).filter(x => x.o[x.k + 'Path'] && x.o[x.k]).map(x => [x.o[x.k + 'Path'], x.o[x.k]]));
        imgRefs(rv).forEach(x => { const p = x.o[x.k + 'Path']; if (p && m.has(p)) x.o[x.k] = m.get(p); });
      }
      rv._sync = rv.updatedAt;
      if (local) { Object.keys(local).forEach(k => delete local[k]); Object.assign(local, rv); } else S.visits.push(rv);
      await DB.put('visits', JSON.parse(JSON.stringify(rv)), true);
    }
    for (const v of [...S.visits]) {
      if (remote.has(v.id) || q.v[v.id]) continue;
      if (v._sync) { if (S.cur && S.cur.id === v.id) continue; S.visits = S.visits.filter(x => x !== v); await DB.del('visits', v.id, true); }
      else this.mark('v', v.id);
    }
  },
  async sync(force) {
    if (!this.sb || !this.uid || !navigator.onLine) return this.status();
    if (!force && Date.now() - this.lastPull < 30000) return this.flush();
    this.lastPull = Date.now();
    try { this.status('⟳ Sincronizando…'); await this.pull(); }
    catch (e) { console.error(e); this.status('⚠ Erro ao sincronizar'); return; }
    await this.flush();
    if (S.user && !S.cur && S.tab !== 'cfg') go(S.tab);
  },
  lastPull: 0,

  needs(v) { return !!v && imgRefs(v).some(r => r.o[r.k + 'Path'] && !r.o[r.k]); },
  async hydrate(v) {
    if (!this.needs(v)) return true;
    if (!this.sb || !navigator.onLine) { toast('Sem internet: as imagens desta visita ainda não foram baixadas neste aparelho.', 4500); return false; }
    toast('Baixando imagens da visita…', 15000); let ok = true;
    await Promise.all(imgRefs(v).filter(r => r.o[r.k + 'Path'] && !r.o[r.k]).map(async r => {
      const { data, error } = await this.sb.storage.from(BUCKET).download(r.o[r.k + 'Path']);
      if (error || !data) { ok = false; return; } r.o[r.k] = await blobToDataURL(data);
    }));
    await DB.put('visits', JSON.parse(JSON.stringify(v)), true);
    const img = v.plan && planImage(v.plan);
    if (img && !img.complete) await new Promise(r => { img.onload = r; img.onerror = r; setTimeout(r, 5000); });
    toast(ok ? 'Imagens carregadas' : 'Algumas imagens não puderam ser baixadas', 2000);
    return ok;
  }
};

/* ---- intercepta o banco local: toda gravação também entra na fila de sincronização ---- */
(() => {
  const put = DB.put.bind(DB), del = DB.del.bind(DB);
  DB.put = (store, val, quiet) => put(store, val).then(r => { if (!quiet) CLOUD.onLocal(store, val); return r; });
  DB.del = (store, key, quiet) => del(store, key).then(r => { if (!quiet) CLOUD.onLocalDel(store, key); return r; });
})();

/* ---- tela de login com conta Supabase (e-mail + senha) ---- */
renderLogin = async function () {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  const box = $('#loginBox');
  if (!DB.db && !DB.mem) await DB.open();
  if (!CLOUD.started && loginMode !== 'recover') {
    let session = null;
    if (CLOUD.sb) { try { const { data } = await CLOUD.sb.auth.getSession(); session = data && data.session; } catch (e) { } }
    if (!session && !navigator.onLine) session = CLOUD.offlineSession();
    if (session) return cloudStart(session);
  }
  if (!CLOUD.sb) {
    box.innerHTML = `<p style="text-align:center">${/SEU-PROJETO/.test(SUPABASE_URL) ? 'O endereço e a chave do Supabase ainda não foram configurados neste arquivo (início do bloco SUPABASE).' : 'Não foi possível conectar ao servidor. Verifique a internet e recarregue a página.'}</p><button class="btn primary block" onclick="location.reload()">Recarregar</button>`;
    return;
  }
  const base = location.origin + location.pathname;
  const tabs = `<div class="login-tabs"><button data-m="in" class="${loginMode === 'in' ? 'on' : ''}">Entrar</button><button data-m="new" class="${loginMode === 'new' ? 'on' : ''}">Criar conta</button></div>`;
  if (loginMode === 'new') box.innerHTML = tabs + `
      <div class="grid">
        <label class="f">Nome completo<input type="text" id="nwName" autocomplete="name"></label>
        <label class="f">Cargo / setor<input type="text" id="nwRole" placeholder="Engenharia / Projetos"></label>
        <label class="f">E-mail<input type="email" id="nwEmail" autocomplete="email"></label>
        <label class="f">Crie uma senha<input type="password" id="nwPin" autocomplete="new-password" placeholder="mínimo 6 caracteres"></label>
      </div>
      <button class="btn primary block" id="nwGo" style="margin-top:14px">Criar conta</button>`;
  else if (loginMode === 'reset') box.innerHTML = `
      <h3 style="margin-top:0">Recuperar senha</h3>
      <label class="f">E-mail da conta<input type="email" id="rsEmail" autocomplete="email"></label>
      <button class="btn primary block" id="rsGo" style="margin-top:14px">Enviar link de recuperação</button>
      <p style="text-align:center"><a href="#" data-m="in">Voltar para o login</a></p>`;
  else if (loginMode === 'recover') box.innerHTML = `
      <h3 style="margin-top:0">Defina uma nova senha</h3>
      <label class="f">Nova senha<input type="password" id="rcPin" autocomplete="new-password" placeholder="mínimo 6 caracteres"></label>
      <button class="btn primary block" id="rcGo" style="margin-top:14px">Salvar senha e entrar</button>`;
  else box.innerHTML = tabs + `
      <label class="f">E-mail<input type="email" id="lgEmail" autocomplete="email"></label>
      <label class="f" style="margin-top:10px">Senha<input type="password" id="lgPin" autocomplete="current-password"></label>
      <button class="btn primary block" id="lgGo" style="margin-top:14px">Entrar</button>
      <p style="text-align:center;margin-bottom:0"><a href="#" data-m="reset">Esqueci minha senha</a></p>`;
  box.insertAdjacentHTML('beforeend', `<p class="small muted" style="margin-top:14px;text-align:center">Suas visitas ficam salvas na sua conta e aparecem em qualquer aparelho em que você entrar. Sem internet, o app continua funcionando e sincroniza depois.</p>`);
  $$('[data-m]', box).forEach(b => b.onclick = e => { e.preventDefault(); loginMode = b.dataset.m; renderLogin(); });
  const busy = (b, on) => { b.disabled = on; b.style.opacity = on ? .6 : 1; };
  const sb = CLOUD.sb;
  if (loginMode === 'in') {
    const go = async () => {
      const b = $('#lgGo'); busy(b, true);
      const { data, error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPin').value });
      busy(b, false); if (error) return toast(authErr(error), 4500); cloudStart(data.session);
    };
    $('#lgGo').onclick = go; $('#lgPin').onkeydown = e => { if (e.key === 'Enter') go(); };
    setTimeout(() => $('#lgEmail') && $('#lgEmail').focus(), 50);
  } else if (loginMode === 'new') {
    $('#nwGo').onclick = async () => {
      const name = $('#nwName').value.trim(), email = $('#nwEmail').value.trim(), pass = $('#nwPin').value;
      if (!name) return toast('Informe o nome'); if (!email) return toast('Informe o e-mail'); if (pass.length < 6) return toast('Senha com no mínimo 6 caracteres');
      const b = $('#nwGo'); busy(b, true);
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name, role: $('#nwRole').value.trim() }, emailRedirectTo: base } });
      busy(b, false); if (error) return toast(authErr(error), 4500);
      if (data.session) return cloudStart(data.session);
      box.innerHTML = `<h3 style="margin-top:0">Confirme seu e-mail</h3><p>Enviamos um link de confirmação para <b>${esc(email)}</b>. Abra o e-mail, clique no link e depois entre com sua senha.</p><button class="btn primary block" data-m="in">Ir para o login</button>`;
      $$('[data-m]', box).forEach(x => x.onclick = () => { loginMode = 'in'; renderLogin(); });
    };
  } else if (loginMode === 'reset') {
    $('#rsGo').onclick = async () => {
      const email = $('#rsEmail').value.trim(); if (!email) return toast('Informe o e-mail');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: base });
      if (error) return toast(authErr(error), 4500);
      toast('Se o e-mail tiver conta, você receberá um link para criar uma nova senha.', 5000); loginMode = 'in'; renderLogin();
    };
  } else if (loginMode === 'recover') {
    $('#rcGo').onclick = async () => {
      const p = $('#rcPin').value; if (p.length < 6) return toast('Senha com no mínimo 6 caracteres');
      const { error } = await sb.auth.updateUser({ password: p }); if (error) return toast(authErr(error), 4500);
      toast('Senha atualizada'); loginMode = 'in'; const { data } = await sb.auth.getSession(); if (data.session) cloudStart(data.session); else renderLogin();
    };
  }
};

async function cloudStart(session) {
  if (CLOUD.started) return; CLOUD.started = true;
  const au = session.user, meta = au.user_metadata || {}; CLOUD.uid = au.id;
  const saved = await DB.get('users', au.id);
  const u = Object.assign({ id: au.id, name: meta.name || (au.email || '').split('@')[0], role: meta.role || '', createdAt: au.created_at }, saved || {}, { email: au.email });
  await startSession(u);
  await migrateLegacy(u);
  CLOUD.status(); CLOUD.sync(true);
}

/* perfis antigos (salvos só neste aparelho, com PIN): oferece enviar as visitas para a conta */
async function migrateLegacy(u) {
  const all = await DB.all('visits'), users = await DB.all('users');
  const groups = {}; all.filter(v => /^u_/.test(v.userId || '')).forEach(v => (groups[v.userId] = groups[v.userId] || []).push(v));
  for (const [old, list] of Object.entries(groups)) {
    if (localStorage.getItem('cip_legacy_skip_' + old)) continue;
    const nm = (users.find(x => x.id === old) || {}).name || 'perfil antigo';
    if (!(await confirmBox(`Encontramos ${list.length} visita(s) salvas neste aparelho no perfil local "${nm}" (versão antiga do app). Deseja enviar essas visitas para a sua conta ${u.email}?`))) { localStorage.setItem('cip_legacy_skip_' + old, '1'); continue; }
    for (const v of list) { v.userId = u.id; delete v._sync; S.visits.push(v); await DB.put('visits', v); }
    const os = await DB.get('settings', old); if (os) { S.cfg = Object.assign({}, os, { userId: u.id }); await DB.put('settings', S.cfg); await DB.del('settings', old, true); }
    await DB.del('users', old, true); toast(list.length + ' visita(s) enviadas para sua conta');
  }
  if (!S.cur && S.tab !== 'cfg') go(S.tab);
}

logout = async function () {
  await saveNow();
  if (CLOUD.pending() && !(await confirmBox(navigator.onLine ? 'Há alterações sendo enviadas para a nuvem. Sair mesmo assim? (elas serão enviadas no próximo login neste aparelho)' : 'Você está sem internet e há alterações ainda não enviadas. Elas só serão enviadas quando você entrar de novo neste aparelho. Sair mesmo assim?'))) return;
  if (navigator.onLine) await CLOUD.flush();
  if (CLOUD.sb) { try { await CLOUD.sb.auth.signOut({ scope: 'local' }); } catch (e) { } }
  clearTimeout(CLOUD.t); CLOUD.uid = null; CLOUD.started = false; CLOUD.lastSync = 0; CLOUD.lastPull = 0;
  S.user = null; S.cur = null; S.visits = []; loginMode = 'in'; renderLogin();
};

/* ---- garante as imagens baixadas antes de abrir, gerar PDF/KMZ ou duplicar ---- */
(() => {
  const _go = go, _rep = openReport, _kmz = exportKMZ;
  go = function (tab, visit) { if (visit && CLOUD.needs(visit)) { CLOUD.hydrate(visit).then(() => _go(tab, visit)); return; } return _go(tab, visit); };
  openReport = function (v) { if (CLOUD.needs(v)) { CLOUD.hydrate(v).then(() => _rep(v)); return; } return _rep(v); };
  exportKMZ = function (v) { if (CLOUD.needs(v)) { CLOUD.hydrate(v).then(() => _kmz(v)); return; } return _kmz(v); };
})();
duplicateVisit = async function (id) {
  const o = S.visits.find(v => v.id === id); if (!o) return; await CLOUD.hydrate(o);
  const v = JSON.parse(JSON.stringify(o)); v.id = 'v_' + uid(); delete v._sync; v.cli.nome = (v.cli.nome || '') + ' (cópia)'; v.status = 'draft'; v.createdAt = v.updatedAt = new Date().toISOString();
  await DB.put('visits', v); S.visits.push(v); toast('Visita duplicada'); go(S.tab);
};

/* ---- ajustes na tela de configurações ---- */
(() => {
  const _rs = renderSettings;
  renderSettings = function () {
    _rs();
    const em = $('#pfEmail'); if (em) { em.readOnly = true; em.title = 'E-mail da conta (usado no login)'; }
    const pin = $('#pfPin');
    if (pin) {
      pin.parentElement.firstChild.textContent = 'Nova senha (opcional)'; pin.placeholder = 'mínimo 6 caracteres';
      pin.onchange = async () => {
        if (!pin.value) return; if (pin.value.length < 6) return toast('Senha com no mínimo 6 caracteres');
        if (!CLOUD.sb || !navigator.onLine) return toast('É preciso estar com internet para trocar a senha');
        const { error } = await CLOUD.sb.auth.updateUser({ password: pin.value }); pin.value = '';
        toast(error ? authErr(error) : 'Senha alterada', 3500);
      };
    }
    const exp = $('#bkExp'); if (!exp) return;
    const p = exp.closest('.card-b').querySelector('p');
    p.innerHTML = `Visitas de <b>${esc(S.user.name)}</b>: ${S.visits.length}. Os dados ficam salvos na sua conta (${esc(S.user.email || '')}) e aparecem em qualquer aparelho em que você entrar. Uma cópia fica neste aparelho para funcionar sem internet; ao reconectar, tudo é sincronizado.<br><span id="syncInfo" class="small muted"></span>`;
    exp.insertAdjacentHTML('beforebegin', '<button class="btn teal" id="syncNow">Sincronizar agora</button>');
    $('#syncNow').onclick = () => { if (!navigator.onLine) return toast('Sem internet'); CLOUD.sync(true); };
    exp.onclick = async () => {
      for (const v of S.visits) await CLOUD.hydrate(v);
      download(`backup_visitas_${safeName(S.user.name)}_${today()}.json`, JSON.stringify({ app: 'clickip-visitas', v: 1, user: { name: S.user.name, role: S.user.role, email: S.user.email }, settings: S.cfg, visits: S.visits }), 'application/json');
    };
    const del = $('#usrDel');
    del.textContent = 'Excluir todas as minhas visitas';
    del.onclick = async () => {
      if (!(await confirmBox('Excluir TODAS as suas visitas, fotos e diagramas da nuvem e de todos os aparelhos? Não dá para desfazer.'))) return;
      for (const v of [...S.visits]) await DB.del('visits', v.id);
      S.visits = []; S.cur = null; toast('Visitas excluídas'); renderSettings();
    };
    CLOUD.status();
  };
})();

CLOUD.init();
if (/type=recovery/.test(location.hash)) loginMode = 'recover';
window.addEventListener('online', () => CLOUD.sync());
window.addEventListener('offline', () => CLOUD.status());
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user) CLOUD.sync(); });
