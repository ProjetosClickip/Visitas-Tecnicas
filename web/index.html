<div class="shell">
  <!-- ============ MENU LATERAL (minimalista) ============ -->
  <aside class="rail" id="menuLateral" aria-label="Menu principal">
    <div class="rail-top">
      <img class="rail-logo" src="/img/logo-portal.png" alt="I_MAIS Click IP">
      <button type="button" class="rail-x" id="menuFechar" aria-label="Fechar menu"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>

    <div class="rail-scroll">
      <nav class="envs" aria-label="Ambiente"><div class="envs-in">
        <p class="rail-h">Ambiente</p>
        <button data-env="pub" class="on"><svg class="ic"><use href="#i-globe"/></svg>Público</button>
        <button data-env="col"><svg class="ic"><use href="#i-user"/></svg>Colaborador</button>
        <button data-env="sup"><svg class="ic"><use href="#i-shield"/></svg>Supervisão</button>
      </div></nav>

      <div class="rail-app" id="railApp">
        <nav class="sysbar" aria-label="Sistemas"><div class="sysbar-in">
          <p class="rail-h">Sistemas</p>
          <button data-sys="inicio" class="on"><svg class="ic"><use href="#i-home"/></svg>Início</button>
          <button data-sys="visitas"><svg class="ic"><use href="#i-clip"/></svg>Visitas Técnicas</button>
          <nav class="tabs" aria-label="Visitas Técnicas"><div class="tabs-in">
            <button data-tab="hist" class="on">Histórico</button>
            <button data-tab="cond"><span class="dot" style="--d:#3b6fb6"></span>Condomínios</button>
            <button data-tab="corp"><span class="dot" style="--d:#159c98"></span>Link Dedicado</button>
            <button data-tab="evt"><span class="dot" style="--d:#f26a21"></span>Eventos</button>
            <button data-tab="cfg">Configurações</button>
          </div></nav>
          <button data-sys="custos"><svg class="ic"><use href="#i-calc"/></svg>Mensuração de Custos</button>
          <button data-sys="fiber"><svg class="ic"><use href="#i-fiber"/></svg>FiberControl<small>em breve</small></button>
          <button data-sys="perfil"><svg class="ic"><use href="#i-cog"/></svg>Perfil</button>
        </div></nav>
      </div>
    </div>

    <div class="rail-foot">
      <div class="who" id="whoBox"></div>
      <span id="net" class="net on">● Online</span>
    </div>
  </aside>
  <div class="scrim" id="menuScrim" aria-hidden="true"></div>

  
<!-- ============ PALCO ============ -->
  <div class="stage" id="palco" tabindex="-1">
    <header class="hdr">
      <button type="button" class="menu-bt" id="menuBt" aria-controls="menuLateral" aria-expanded="false" aria-label="Abrir menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="hdr-t">
        <h1>Plataforma de Projetos Click IP</h1>
        <span class="crumb" aria-hidden="true"></span>
      </div>
    </header>

    <section id="envPub"><main id="pubMain"></main></section>
    <section id="envCol" class="hidden">
      <main id="colLogin"></main>
      <div id="app" class="hidden">
        <main id="main"></main>
        <div id="custosWrap" class="hidden"></div>
      </div>
    </section>
    <section id="envSup" class="hidden"><main id="supMain"></main></section>

    <footer class="foot">Grupo Click IP · I_MAIS · Engenharia / Planejamento e Implantação de Projetos<span>Visitas Técnicas · Mensuração de Custos · FiberControl</span></footer>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
